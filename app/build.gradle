plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.persona.companion'
    compileSdk 36

    defaultConfig {
        applicationId "com.persona.companion"
        minSdk 26
        targetSdk 36
        versionCode 64
        versionName "8.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('release.keystore')
            storePassword 'android'
            keyAlias 'persona-companion'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "boolean", "ENABLE_DEBUG_FEATURES", "true"
            buildConfigField "boolean", "INCLUDE_IMAGES", "true"
            // Debug includes all images bundled for testing
            
            // Cloud image download configuration
            // GitHub Releases (up to 2GB) or Internet Archive (unlimited)
            buildConfigField "String", "IMAGES_CDN_URL", '"https://github.com/Sentovibes/persona-companion-images/releases/download/v3.0/images.zip"'
            buildConfigField "long", "IMAGES_ZIP_SIZE", "1039444374L"
            buildConfigField "String", "IMAGES_VERSION", '"3.0"'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
            buildConfigField "boolean", "ENABLE_DEBUG_FEATURES", "false"
            buildConfigField "boolean", "INCLUDE_IMAGES", "true"
            // Release includes images bundled
            
            // Cloud image download configuration
            buildConfigField "String", "IMAGES_CDN_URL", '"https://github.com/Sentovibes/persona-companion-images/releases/download/v3.0/images.zip"'
            buildConfigField "long", "IMAGES_ZIP_SIZE", "1039444374L"
            buildConfigField "String", "IMAGES_VERSION", '"3.0"'
        }
    }
    
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    aaptOptions {
        cruncherEnabled = false
        noCompress "webp"
        // Bundle the lightweight 14MB WebP catalog directly while skipping legacy ~1GB PNGs
        ignoreAssetsPattern "!*.png:!.svn:!.git:!.ds_store:!*.scc:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }
    
    applicationVariants.all { variant ->
        variant.outputs.all {
            def buildType = variant.buildType.name
            if (buildType == "debug") {
                outputFileName = "persona-companion-v${variant.versionName}-debug.apk"
            } else {
                outputFileName = "persona-companion-v${variant.versionName}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            keepDebugSymbols += '**/*.so'
        }
    }
}

// Sync the canonical WebP artwork catalog from docs/assets/images into app assets
tasks.register('syncWebpPersonaImages', Copy) {
    from '../docs/assets/images/personas'
    into 'src/main/assets/images/personas_shared'
    include '*.webp'
}

tasks.register('syncWebpEnemyImages', Copy) {
    from '../docs/assets/images/enemies'
    into 'src/main/assets/images/enemies_shared'
    include '*.webp'
}

preBuild.dependsOn syncWebpPersonaImages, syncWebpEnemyImages

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Compose BOM — keeps all Compose versions in sync
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // HTTP Server for custom cast
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    
    // QR Code generation
    implementation 'com.google.zxing:core:3.5.2'
    
    // Image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // Debug tools
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
